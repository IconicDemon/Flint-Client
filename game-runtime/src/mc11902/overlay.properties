# Minecraft 1.19.2 builds on the 1.21.1 overlay (which builds on 1.21.10 and 1.21.11): what 1.21.1 bridges (render states,
# input events, the 2D pose, pipelines) 1.19.2 needs too; this overlay adds what 1.20 to 1.21 brought (GuiGraphics, JOML,
# the built-in registries, data components...).
base=mc12101
# 1.19.x runs on Java 17 (the official launcher's java-runtime-gamma).
java=17
# 1.19.2 predates JOML (1.19.3 brought it, the version 26.x has): Flint carries it.
bundle=org.joml:joml:1.10.8
