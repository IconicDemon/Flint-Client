# Minecraft 1.21.10 builds on the 1.21.11 overlay: its rules and files first, then this overlay's
# (shared-sources.rules here applies to what 1.21.11's left, its own files included; java/ replaces files).
base=mc12111
# 1.21.10's Minecraft doesn't bring jspecify (1.21.11's does); the sources' @Nullable needs it to compile.
compileOnly=org.jspecify:jspecify:1.0.0
