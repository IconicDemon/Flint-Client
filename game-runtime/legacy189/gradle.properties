org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Minecraft 1.8.9 through Ornithe (https://ornithemc.net/develop)
minecraft_version=1.8.9
loader_version=0.20.1
loom_version=1.18.3
ploceus_version=1.18.4
feather_build=2

# The shared sources' libraries that 1.8.9 lacks: Gson as 26.3 ships it (compiled in, relocated: build.gradle relocateGson)
# and compile-only annotations.
gson_version=2.14.0
error_prone_annotations_version=2.48.0
jspecify_version=1.0.0

# Flint Client (the version comes from ../../app/package.json)
maven_group=com.flintclient
archive_base_name=flint-game-runtime
