[package]
name = "flint-app"
version = "0.5.2"
description = "The Flint Client desktop application"
authors = ["Flint Client"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "flint_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tauri-plugin-autostart = "2"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
rsa = { version = "0.9", features = ["sha2"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2"

[features]
# Measurement builds only (`npm run perf-build`): the QA identity in isolated data, the scenario
# runner hook and the `perf_write` command. Never enabled in releases.
perf = []
